name: Monitor PJe

on:
  workflow_dispatch:
  schedule:
    # UTC -> Brasília: 07h00, 08h30, 10h00; TODOS os dias
    - cron: "0 10 * * *"
    - cron: "30 11 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: monitor-trt2-diario
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Atualizar registro antes de verificar duplicidade
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar monitor e enviar relatório
        id: consulta
        env:
          PJE_API_URL: ${{ secrets.PJE_API_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python monitor.py

      - name: Salvar registro de envio no GitHub
        if: steps.consulta.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor-state/last_success.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no registro; relatório já registrado."
            exit 0
          fi
          git commit -m "chore: registrar relatório diário TRT2 [skip ci]"
          # Atualizações paralelas independentes não devem bloquear o registro.
          for tentativa in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflito no registro; exige verificação manual."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Registro salvo no GitHub."
              exit 0
            fi
            sleep 5
          done
          echo "ERRO: e-mail pode ter sido enviado, mas o registro não foi salvo."
          exit 1

      - name: Alertar falha da consulta ou do envio de e-mail
        if: always() && steps.consulta.outcome == 'failure'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYCODE'
          import os, smtplib
          from datetime import datetime
          from email.message import EmailMessage
          from zoneinfo import ZoneInfo
          required = ("SMTP_HOST", "SMTP_USUARIO", "SMTP_SENHA", "EMAIL_DESTINATARIO")
          if any(not os.getenv(k) for k in required):
              raise SystemExit("Secrets de e-mail incompletos; alerta não enviado.")
          data = datetime.now(ZoneInfo("America/Sao_Paulo")).strftime("%d/%m/%Y")
          msg = EmailMessage()
          msg["Subject"] = f"ALERTA: Monitor TRT2 falhou na consulta - {data}"
          msg["From"] = os.getenv("EMAIL_REMETENTE") or os.environ["SMTP_USUARIO"]
          msg["To"] = os.environ["EMAIL_DESTINATARIO"]
          msg.set_content(
              "O monitor não concluiu a consulta ou o envio de e-mail. "
              "Não interprete como zero publicações. "
              "Confira se houve envio antes de executar novamente.\n"
              f"Log: {os.environ['RUN_URL']}\n"
          )
          with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.getenv("SMTP_PORT") or "587"), timeout=60) as smtp:
              smtp.ehlo()
              smtp.starttls()
              smtp.ehlo()
              smtp.login(os.environ["SMTP_USUARIO"], os.environ["SMTP_SENHA"])
              smtp.send_message(msg)
          PYCODE
